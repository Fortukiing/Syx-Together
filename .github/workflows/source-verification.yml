name: Source verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reject generated and private diagnostic files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.jar' -o -name '*.class' -o -name '*.zip' -o -name '*.save' -o -name '*.dmp' -o -name '*.dump' -o -name 'coop-log*.txt' -o -name 'error*.txt' -o -name 'crash*.txt' -o -name '*.bak' \) -not -path './.git/*' | grep -q .; then
            echo 'Generated, diagnostic, save or backup files must not be committed.'
            exit 1
          fi
          if grep -RniE 'C:\\Users\\(pedro|anaso)' --exclude-dir=.git .; then
            echo 'Personal filesystem paths must not be committed.'
            exit 1
          fi
          if grep -RniE 'catch[[:space:]]*\([[:space:]]*Throwable\b' --include='*.java' src; then
            echo 'Catching Throwable is not allowed.'
            exit 1
          fi

      - name: Compile public protocol tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          javac --release 21 -encoding UTF-8 -d build/ci \
            src/test-support/java/game/event/engine/EContext.java \
            src/test-support/java/game/faction/diplomacy/deal/DealSave.java \
            src/test-support/java/view/ui/message/Message.java \
            src/main/java/coopmod/CoopProtocol.java \
            src/main/java/coopmod/CoopSaveTransfer.java \
            src/test/java/coopmod/CoopProtocolTest.java \
            src/test/java/coopmod/CoopSaveTransferTest.java

      - name: Run public protocol tests
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/ci coopmod.CoopProtocolTest
          java -cp build/ci coopmod.CoopSaveTransferTest

      - name: Confirm Java 21 bytecode
        shell: bash
        run: |
          set -euo pipefail
          javap -verbose -classpath build/ci coopmod.CoopProtocol | grep 'major version: 65'
